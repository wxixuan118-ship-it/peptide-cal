<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="280" rx="16" fill="#f3f8f8"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#15232b">One KLOW draw, three steps</text>

  <g font-size="15" fill="#15232b">
    <rect x="40" y="72" width="200" height="150" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="58" y="100" font-weight="700">1. The vial</text>
    <text x="58" y="130" fill="#546570">50 mg GHK-Cu</text>
    <text x="58" y="154" fill="#546570">10 mg BPC-157</text>
    <text x="58" y="178" fill="#546570">10 mg TB-500</text>
    <text x="58" y="202" fill="#546570">10 mg KPV</text>

    <rect x="275" y="72" width="200" height="150" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="293" y="100" font-weight="700">2. Add 3 mL water</text>
    <text x="293" y="130" fill="#546570">16.667 mg/mL</text>
    <text x="293" y="154" fill="#546570">3.333 mg/mL each</text>
    <text x="293" y="188" font-size="17" font-weight="700" fill="#0b7a75">26.667 mg/mL total</text>

    <rect x="510" y="72" width="250" height="150" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="528" y="100" font-weight="700">3. Draw 6 units</text>
    <text x="528" y="130" fill="#546570">0.06 mL = 1 mg GHK-Cu</text>
    <text x="528" y="154" fill="#546570">+ 200 mcg BPC-157</text>
    <text x="528" y="178" fill="#546570">+ 200 mcg TB-500</text>
    <text x="528" y="202" fill="#546570">+ 200 mcg KPV</text>
  </g>
  <path d="M244 147 h27 M479 147 h27" stroke="#0b7a75" stroke-width="3"/>
  <text x="40" y="256" font-size="14" fill="#546570">Example only: the dose is measured on GHK-Cu. The other three peptides follow at the vial ratio.</text>
</svg>
