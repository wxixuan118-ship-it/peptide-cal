<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Molarity calculation</title>
  <desc id="desc">Mass divided by molecular weight gives moles; moles divided by final volume in litres gives molarity.</desc>
  <rect width="800" height="280" rx="22" fill="#edf8f6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="34" y="75" width="210" height="130" rx="16" fill="#fff" stroke="#b5d9d4"/>
    <text x="139" y="122" font-size="21" font-weight="700" fill="#143f3c">Mass (g)</text>
    <text x="139" y="159" font-size="16" fill="#426661">5 mg = 0.005 g</text>
    <text x="268" y="151" font-size="34" fill="#0b7a75">÷</text>
    <rect x="294" y="75" width="210" height="130" rx="16" fill="#fff" stroke="#b5d9d4"/>
    <text x="399" y="122" font-size="20" font-weight="700" fill="#143f3c">MW (g/mol)</text>
    <text x="399" y="159" font-size="16" fill="#426661">1,500 g/mol</text>
    <text x="528" y="151" font-size="34" fill="#0b7a75">÷</text>
    <rect x="554" y="75" width="212" height="130" rx="16" fill="#fff" stroke="#b5d9d4"/>
    <text x="660" y="122" font-size="19" font-weight="700" fill="#143f3c">Final volume (L)</text>
    <text x="660" y="159" font-size="16" fill="#426661">2 mL = 0.002 L</text>
    <text x="400" y="248" font-size="23" font-weight="700" fill="#0b7a75">= 0.001667 M = 1.667 mM</text>
  </g>
</svg>
