<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="280" rx="16" fill="#f3f8f8"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#15232b">Diluting a peptide with C1 × V1 = C2 × V2</text>
  <g font-size="15" fill="#15232b">
    <rect x="40" y="80" width="210" height="130" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="60" y="112" font-weight="700">Stock solution</text>
    <text x="60" y="142" fill="#546570">C1 = 5 mg/mL</text>
    <text x="60" y="182" font-size="22" font-weight="700" fill="#0b7a75">take 0.4 mL</text>
    <rect x="295" y="80" width="210" height="130" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="315" y="112" font-weight="700">Add diluent</text>
    <text x="315" y="142" fill="#546570">2 mL − 0.4 mL</text>
    <text x="315" y="182" font-size="22" font-weight="700" fill="#0b7a75">1.6 mL</text>
    <rect x="550" y="80" width="210" height="130" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
    <text x="570" y="112" font-weight="700">Diluted solution</text>
    <text x="570" y="142" fill="#546570">V2 = 2 mL</text>
    <text x="570" y="182" font-size="22" font-weight="700" fill="#0b7a75">C2 = 1 mg/mL</text>
  </g>
  <path d="M254 145 h36 M509 145 h36" stroke="#0b7a75" stroke-width="3"/>
  <text x="40" y="248" font-size="14" fill="#546570">Example: a 5× dilution. A 250 mcg dose moves from 5 units to 25 units on a U-100 syringe.</text>
</svg>
