<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="280" rx="16" fill="#f3f8f8"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#15232b">Peptide molecular weight = residues + one water</text>
  <g font-size="15" fill="#15232b" text-anchor="middle">
    <g font-weight="700">
      <rect x="40" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="71" y="109">D</text>
      <rect x="112" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="143" y="109">R</text>
      <rect x="184" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="215" y="109">V</text>
      <rect x="256" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="287" y="109">Y</text>
      <rect x="328" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="359" y="109">I</text>
      <rect x="400" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="431" y="109">H</text>
      <rect x="472" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="503" y="109">P</text>
      <rect x="544" y="76" width="62" height="54" rx="10" fill="#ffffff" stroke="#c5d2d7"/><text x="575" y="109">F</text>
      <rect x="640" y="76" width="120" height="54" rx="10" fill="#e3f1f0" stroke="#0b7a75"/><text x="700" y="109">+ H₂O</text>
    </g>
    <g font-size="12" fill="#546570">
      <text x="71" y="150">115.09</text><text x="143" y="150">156.19</text><text x="215" y="150">99.13</text><text x="287" y="150">163.17</text>
      <text x="359" y="150">113.16</text><text x="431" y="150">137.14</text><text x="503" y="150">97.12</text><text x="575" y="150">147.17</text>
      <text x="700" y="150">18.02</text>
    </g>
  </g>
  <text x="40" y="200" font-size="22" font-weight="700" fill="#0b7a75">= 1,046.18 g/mol average · 1,045.53 Da monoisotopic</text>
  <text x="40" y="248" font-size="14" fill="#546570">Example: angiotensin II (DRVYIHPF), formula C50H71N13O12. Residue masses are average values.</text>
