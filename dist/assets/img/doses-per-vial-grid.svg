  <rect x="451.80" y="130" width="47.30" height="44" rx="4" fill="#0b7a75"/>
  <rect x="502.10" y="130" width="47.30" height="44" rx="4" fill="#0b7a75"/>
  <rect x="552.40" y="130" width="47.30" height="44" rx="4" fill="#0b7a75"/>
  <rect x="602.70" y="130" width="47.30" height="44" rx="4" fill="#0b7a75"/>
  <text x="680" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0b655f" text-anchor="start">10 doses</text>
  <text x="40" y="220" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15232b" text-anchor="start">1 mg</text>
  <rect x="150.00" y="190" width="97.60" height="44" rx="4" fill="#0b7a75"/>
  <rect x="250.60" y="190" width="97.60" height="44" rx="4" fill="#0b7a75"/>
  <rect x="351.20" y="190" width="97.60" height="44" rx="4" fill="#0b7a75"/>
  <rect x="451.80" y="190" width="97.60" height="44" rx="4" fill="#0b7a75"/>
  <rect x="552.40" y="190" width="97.60" height="44" rx="4" fill="#0b7a75"/>
  <text x="680" y="220" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0b655f" text-anchor="start">5 doses</text>
  <text x="40" y="280" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15232b" text-anchor="start">2.5 mg</text>
  <rect x="150.00" y="250" width="248.50" height="44" rx="4" fill="#0b7a75"/>
  <rect x="401.50" y="250" width="248.50" height="44" rx="4" fill="#0b7a75"/>
  <text x="680" y="280" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0b655f" text-anchor="start">2 doses</text>
  <text x="400" y="328" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#546570" text-anchor="middle">Example values only. Water volume does not change these counts.</text>
</svg>
