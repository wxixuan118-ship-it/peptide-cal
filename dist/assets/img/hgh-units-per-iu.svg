<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="310" rx="16" fill="#f3f8f8"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#15232b">Units for a 1 IU dose, by vial size and water volume</text>

  <g font-size="12" fill="#546570">
    <rect x="560" y="52" width="14" height="14" fill="#a8cfcb"/><text x="580" y="64">1 mL</text>
    <rect x="628" y="52" width="14" height="14" fill="#2f9e95"/><text x="648" y="64">2 mL</text>
    <rect x="696" y="52" width="14" height="14" fill="#0b7a75"/><text x="716" y="64">3 mL</text>
  </g>

  <g stroke="#c5d2d7" stroke-width="1">
    <line x1="76" y1="215" x2="760" y2="215"/>
    <line x1="76" y1="170" x2="760" y2="170" stroke-dasharray="4 5"/>
    <line x1="76" y1="125" x2="760" y2="125" stroke-dasharray="4 5"/>
    <line x1="76" y1="80" x2="760" y2="80" stroke-dasharray="4 5"/>
  </g>
  <g font-size="12" fill="#546570" text-anchor="end">
    <text x="66" y="219">0</text>
    <text x="66" y="174">15</text>
    <text x="66" y="129">30</text>
    <text x="66" y="84">45</text>
  </g>

  <g>
    <rect x="112" y="170" width="32" height="45" fill="#a8cfcb"/>
    <rect x="152" y="125" width="32" height="90" fill="#2f9e95"/>
    <rect x="192" y="80" width="32" height="135" fill="#0b7a75"/>

    <rect x="282" y="192" width="32" height="23" fill="#a8cfcb"/>
    <rect x="322" y="170" width="32" height="45" fill="#2f9e95"/>
    <rect x="362" y="147" width="32" height="68" fill="#0b7a75"/>

    <rect x="452" y="196" width="32" height="19" fill="#a8cfcb"/>
    <rect x="492" y="177" width="32" height="38" fill="#2f9e95"/>
    <rect x="532" y="159" width="32" height="56" fill="#0b7a75"/>

    <rect x="622" y="207" width="32" height="8" fill="#a8cfcb"/>
    <rect x="662" y="202" width="32" height="13" fill="#2f9e95"/>
    <rect x="702" y="196" width="32" height="19" fill="#0b7a75"/>
  </g>

  <g font-size="12" font-weight="700" fill="#15232b" text-anchor="middle">
    <text x="168" y="72">20</text><text x="208" y="72">40</text><text x="248" y="72">60</text>
    <text x="338" y="184">10</text><text x="378" y="162">20</text><text x="418" y="139">30</text>
    <text x="508" y="188">8.3</text><text x="548" y="169">16.7</text><text x="588" y="151">25</text>
    <text x="678" y="199">2.8</text><text x="718" y="194">5.6</text>
  </g>
  <g font-size="14" fill="#15232b" text-anchor="middle">
    <text x="168" y="238">5 IU</text>
    <text x="338" y="238">10 IU</text>
    <text x="508" y="238">12 IU</text>
    <text x="678" y="238">36 IU</text>
  </g>
  <text x="40" y="272" font-size="13" fill="#546570">A 36 IU vial with 3 mL gives 8.3 units per 1 IU — small but readable. With 1 mL it would be 2.8 units.</text>
  <text x="40" y="294" font-size="13" fill="#546570">Multiply any bar by your prescribed dose in IU.</text>
</svg>
