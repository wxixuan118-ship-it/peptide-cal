<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="310" rx="16" fill="#f3f8f8"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#15232b">Units for a 1 IU dose, by vial size and water volume</text>

  <g font-size="12" fill="#546570">
    <rect x="560" y="52" width="14" height="14" fill="#a8cfcb"/><text x="580" y="64">1 mL</text>
    <rect x="628" y="52" width="14" height="14" fill="#2f9e95"/><text x="648" y="64">2 mL</text>
    <rect x="696" y="52" width="14" height="14" fill="#0b7a75"/><text x="716" y="64">3 mL</text>
  </g>

  <g stroke="#c5d2d7" stroke-width="1">
    <line x1="76" y1="215" x2="760" y2="215"/>
    <line x1="76" y1="181" x2="760" y2="181" stroke-dasharray="4 5"/>
    <line x1="76" y1="147" x2="760" y2="147" stroke-dasharray="4 5"/>
    <line x1="76" y1="114" x2="760" y2="114" stroke-dasharray="4 5"/>
    <line x1="76" y1="80" x2="760" y2="80" stroke-dasharray="4 5"/>
  </g>
  <g font-size="12" fill="#546570" text-anchor="end">
    <text x="66" y="219">0</text>
    <text x="66" y="185">15</text>
    <text x="66" y="151">30</text>
    <text x="66" y="118">45</text>
    <text x="66" y="84">60</text>
  </g>

  <g>
    <rect x="88" y="177" width="20" height="38" fill="#a8cfcb"/>
    <rect x="114" y="140" width="20" height="75" fill="#2f9e95"/>
    <rect x="140" y="103" width="20" height="112" fill="#0b7a75"/>

    <rect x="200" y="193" width="20" height="22" fill="#a8cfcb"/>
    <rect x="226" y="170" width="20" height="45" fill="#2f9e95"/>
    <rect x="252" y="148" width="20" height="67" fill="#0b7a75"/>

    <rect x="312" y="196" width="20" height="19" fill="#a8cfcb"/>
    <rect x="338" y="177" width="20" height="38" fill="#2f9e95"/>
    <rect x="364" y="159" width="20" height="56" fill="#0b7a75"/>

    <rect x="424" y="201" width="20" height="14" fill="#a8cfcb"/>
    <rect x="450" y="187" width="20" height="28" fill="#2f9e95"/>
    <rect x="476" y="173" width="20" height="42" fill="#0b7a75"/>

    <rect x="536" y="206" width="20" height="9" fill="#a8cfcb"/>
    <rect x="562" y="196" width="20" height="19" fill="#2f9e95"/>
    <rect x="588" y="187" width="20" height="28" fill="#0b7a75"/>

    <rect x="648" y="209" width="20" height="6" fill="#a8cfcb"/>
    <rect x="674" y="202" width="20" height="13" fill="#2f9e95"/>
    <rect x="700" y="196" width="20" height="19" fill="#0b7a75"/>
  </g>

  <g font-size="12" font-weight="700" fill="#15232b" text-anchor="middle">
    <text x="98" y="172">16.7</text><text x="124" y="135">33.3</text><text x="150" y="98">50</text>
    <text x="210" y="188">10</text><text x="236" y="165">20</text><text x="262" y="143">30</text>
    <text x="322" y="191">8.3</text><text x="348" y="172">16.7</text><text x="374" y="154">25</text>
    <text x="434" y="196">6.3</text><text x="460" y="182">12.5</text><text x="486" y="168">18.8</text>
    <text x="546" y="201">4.2</text><text x="572" y="191">8.3</text><text x="598" y="182">12.5</text>
    <text x="658" y="204">2.8</text><text x="684" y="197">5.6</text><text x="710" y="191">8.3</text>
  </g>
  <g font-size="14" fill="#15232b" text-anchor="middle">
    <text x="124" y="238">6 IU</text>
    <text x="236" y="238">10 IU</text>
    <text x="348" y="238">12 IU</text>
    <text x="460" y="238">16 IU</text>
    <text x="572" y="238">24 IU</text>
    <text x="684" y="238">36 IU</text>
  </g>
  <text x="40" y="272" font-size="13" fill="#546570">A 36 IU vial with 3 mL gives 8.3 units per 1 IU — small but readable. With 1 mL it would be 2.8 units.</text>
  <text x="40" y="294" font-size="13" fill="#546570">Multiply any bar by your prescribed dose in IU.</text>
</svg>
