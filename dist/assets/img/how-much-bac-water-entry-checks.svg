<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" role="img" aria-labelledby="title desc">
  <title id="title">Five checks for water volume inputs</title>
  <desc id="desc">Check mg against mcg, measured volume, partly used vials, blend vials, and U-100 units against IU.</desc>
  <rect width="800" height="388" rx="18" fill="#eef3f4"/>
  <text x="400" y="44" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15232b" text-anchor="middle">Five checks before you trust the result</text>
  <rect x="28" y="66" width="744" height="52" rx="12" fill="#fff" stroke="#d6e0e4" stroke-width="2"/>
  <circle cx="60" cy="92" r="15" fill="#0b7a75"/>
  <text x="60" y="98" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="99" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15232b" text-anchor="start">mg or mcg?</text>
  <text x="330" y="99" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#546570" text-anchor="start">5 mg = 5,000 mcg</text>
  <rect x="28" y="128" width="744" height="52" rx="12" fill="#fff" stroke="#d6e0e4" stroke-width="2"/>
  <circle cx="60" cy="154" r="15" fill="#0b7a75"/>
  <text x="60" y="160" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="88" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15232b" text-anchor="start">Measured or estimated?</text>
  <text x="330" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#546570" text-anchor="start">Enter the volume actually added</text>
  <rect x="28" y="190" width="744" height="52" rx="12" fill="#fff" stroke="#d6e0e4" stroke-width="2"/>
  <circle cx="60" cy="216" r="15" fill="#0b7a75"/>
  <text x="60" y="222" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="88" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15232b" text-anchor="start">Partly used vial?</text>
  <text x="330" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#546570" text-anchor="start">The label no longer describes the contents</text>
  <rect x="28" y="252" width="744" height="52" rx="12" fill="#fff" stroke="#d6e0e4" stroke-width="2"/>
  <circle cx="60" cy="278" r="15" fill="#0b7a75"/>
  <text x="60" y="284" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="88" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15232b" text-anchor="start">Blend vial?</text>
  <text x="330" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#546570" text-anchor="start">Each component has its own concentration</text>
  <rect x="28" y="314" width="744" height="52" rx="12" fill="#fff" stroke="#d6e0e4" stroke-width="2"/>
  <circle cx="60" cy="340" r="15" fill="#0b7a75"/>
  <text x="60" y="346" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="88" y="347" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15232b" text-anchor="start">Units or IU?</text>
  <text x="330" y="347" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#546570" text-anchor="start">U-100 marks measure volume, not IU</text>
</svg>
