<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Syringe marks for four BAC water volumes</title>
  <desc id="desc">With a 5 mg vial and 250 mcg dose, 1 mL gives 5 units, 2 mL gives 10 units, 2.5 mL gives 12.5 units and 3 mL gives 15 units. Doses per vial stays 20.</desc>
  <rect width="800" height="400" rx="18" fill="#eef3f4"/>
