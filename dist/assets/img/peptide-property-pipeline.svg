<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="290" rx="16" fill="#f3f8f8"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#15232b">One sequence, six numbers that decide handling</text>

  <rect x="40" y="72" width="250" height="150" rx="12" fill="#ffffff" stroke="#c5d2d7"/>
  <text x="60" y="100" font-size="14" font-weight="700" fill="#15232b">Sequence</text>
  <text x="60" y="136" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0b7a75">GEPPPGKPADDAGLV</text>
  <text x="60" y="164" font-size="14" fill="#546570">15 residues, BPC-157</text>
  <text x="60" y="188" font-size="14" fill="#546570">free N- and C-terminus</text>
  <text x="60" y="210" font-size="14" fill="#546570">0 disulfides</text>

  <path d="M300 147 h40" stroke="#0b7a75" stroke-width="3"/>
  <path d="M334 140 l10 7 -10 7 z" fill="#0b7a75"/>

  <g font-size="13" fill="#15232b">
    <rect x="350" y="62" width="190" height="48" rx="8" fill="#e7f1f0"/>
    <text x="364" y="82" font-weight="700">Average MW</text>
    <text x="364" y="101" fill="#546570">1,419.5 Da</text>

    <rect x="350" y="118" width="190" height="48" rx="8" fill="#e7f1f0"/>
    <text x="364" y="138" font-weight="700">Monoisotopic mass</text>
    <text x="364" y="157" fill="#546570">1,418.5 Da</text>

    <rect x="350" y="174" width="190" height="48" rx="8" fill="#e7f1f0"/>
    <text x="364" y="194" font-weight="700">Net charge at pH</text>
    <text x="364" y="213" fill="#546570">from pKa set</text>

    <rect x="560" y="62" width="200" height="48" rx="8" fill="#e7f1f0"/>
    <text x="574" y="82" font-weight="700">Isoelectric point</text>
    <text x="574" y="101" fill="#546570">pI ≈ 3.9</text>

    <rect x="560" y="118" width="200" height="48" rx="8" fill="#e7f1f0"/>
    <text x="574" y="138" font-weight="700">GRAVY</text>
    <text x="574" y="157" fill="#546570">−0.69 (hydrophilic)</text>

    <rect x="560" y="174" width="200" height="48" rx="8" fill="#e7f1f0"/>
    <text x="574" y="194" font-weight="700">ε280</text>
    <text x="574" y="213" fill="#546570">0 (no Trp/Tyr/Cys)</text>
  </g>

  <text x="40" y="252" font-size="14" fill="#546570">Calculated values, not measurements. Termini, disulfides and non-standard residues change every number.</text>
  <text x="40" y="274" font-size="14" fill="#546570">Compare with the certificate of analysis before you trust a mass for weighing.</text>
</svg>
